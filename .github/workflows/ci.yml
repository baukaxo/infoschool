name: InfoSchool CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Подготовка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузка файлов сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Публикация сайта
        id: deployment
        uses: actions/deploy-pages@v4
